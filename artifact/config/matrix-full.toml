# Ablations, traced timeline and mode-B public-bits aggregate (tab:ablation).

[[runs]]
kind = "mode_b"
tag = "mode-b"
params = "44"
configs = ["ifma", "avx2"]
allocations = ["16C32T"]
sizes = [32768]
relation = "h-fips"
warmup = 1
reps = 5

[[runs]]
kind = "ablations"
tag = "ablation"
params = "44"
configs = ["ifma", "avx2"]
allocations = ["16C32T"]
sizes = [32768]
relation = "h-fips"
warmup = 1
reps = 5
processes = 1
arms = [
  { tag = "defaults", env = {} },
  { tag = "no-hugepage", env = { AGG_HUGEPAGE = "0" } },
  { tag = "no-alloc-cache", env = { AGG_ALLOC_CACHE = "0" } },
  { tag = "flock-serial", env = { AGG_FLOCK_THREADS = "0" } },
  { tag = "late-join", env = { AGG_LATE_JOIN = "0" } },
  { tag = "stage-branch-main-pool", env = { AGG_PIOP_S_THREADS = "0" } },
  { tag = "piop-row", env = { AGG_PIOP_LAYOUT = "row" } },
]

[[runs]]
kind = "ablations"
tag = "timeline"
params = "44"
configs = ["ifma", "avx2"]
allocations = ["16C32T"]
sizes = [32768]
relation = "h-fips"
warmup = 1
reps = 1
processes = 1
traced = true
arms = [
  { tag = "defaults", env = {} },
  { tag = "flock-serial", env = { AGG_FLOCK_THREADS = "0" } },
]

# Traced default runs of ML-DSA-65 and -87 on AVX2: the per-set verifier steps
# of the evaluation (Flock part, key decoding, ExpandA with w_A).
[[runs]]
kind = "ablations"
tag = "timeline-sets"
params = ["65", "87"]
configs = ["avx2"]
allocations = ["16C32T"]
sizes = [32768]
relation = "h-fips"
warmup = 1
reps = 1
processes = 1
traced = true
arms = [
  { tag = "defaults", env = {} },
]

# Fresh-process peak RSS measurements.

[[runs]]
kind = "fresh"
tag = "prover-memory"
params = "44"
configs = ["ifma", "avx2"]
allocations = ["16C32T", "8C16T", "1T"]
sizes = [32768]
relation = "h-fips"
reps = 3
mode = "aggregate"

[[runs]]
kind = "fresh"
tag = "verifier-memory"
params = "44"
configs = ["ifma", "avx2"]
allocations = ["16C32T", "8C16T", "1T"]
sizes = [32768]
relation = "h-fips"
reps = 5
mode = "verify"

