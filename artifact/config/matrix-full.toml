# Full mode: the experiment matrix of the evaluation, without a scheduler.
# Cells run with --warmup 1 --reps N, split into `processes` chunks that
# are launched round-robin across tiers. The runs below are executed in the order
# the paper reports them, covering ML-DSA-44, ML-DSA-65 and ML-DSA-87.
# Every group runs H-FIPS except the opt-in `relations` groups (H-exact).

mode = "full"

# Headline prover and verifier rows (tab:baselines, tab:bytes).

[[runs]]
kind = "ours"
tag = "headline"
params = "44"
configs = ["ifma", "avx512", "avx2"]
allocations = ["16C32T", "8C16T"]
sizes = [32768]
relation = "h-fips"
warmup = 1
reps = 5
processes = 1

[[runs]]
kind = "ours"
tag = "headline-65"
params = "65"
configs = ["ifma", "avx512", "avx2"]
allocations = ["16C32T", "8C16T"]
sizes = [32768]
relation = "h-fips"
warmup = 1
reps = 5
processes = 1

[[runs]]
kind = "ours"
tag = "headline-87"
params = "87"
configs = ["ifma", "avx512", "avx2"]
allocations = ["16C32T", "8C16T"]
sizes = [32768]
relation = "h-fips"
warmup = 1
reps = 5
processes = 1

[[runs]]
kind = "ours"
tag = "headline-1t"
params = "44"
configs = ["ifma", "avx512", "avx2"]
allocations = ["1T"]
sizes = [32768]
relation = "h-fips"
warmup = 1
reps = 5
processes = 2

[[runs]]
kind = "ours"
tag = "headline-1t-65"
params = "65"
configs = ["ifma", "avx512", "avx2"]
allocations = ["1T"]
sizes = [32768]
relation = "h-fips"
warmup = 1
reps = 5
processes = 2

[[runs]]
kind = "ours"
tag = "headline-1t-87"
params = "87"
configs = ["ifma", "avx512", "avx2"]
allocations = ["1T"]
sizes = [32768]
relation = "h-fips"
warmup = 1
reps = 5
processes = 2

# The reference relation H-exact across all three parameter sets (tab:relations), against
# the H-FIPS headline cells. Opt-in: these groups run only with --relations h-fips,h-exact
# (or --relations h-exact).

[[runs]]
kind = "ours"
tag = "relations"
params = "44"
configs = ["ifma", "avx512", "avx2"]
allocations = ["16C32T", "8C16T"]
sizes = [32768]
relations = ["h-exact"]
warmup = 1
reps = 5
processes = 2

[[runs]]
kind = "ours"
tag = "relations-65"
params = "65"
configs = ["ifma", "avx512", "avx2"]
allocations = ["16C32T"]
sizes = [32768]
relations = ["h-exact"]
warmup = 1
reps = 5
processes = 2

[[runs]]
kind = "ours"
tag = "relations-87"
params = "87"
configs = ["ifma", "avx512", "avx2"]
allocations = ["16C32T"]
sizes = [32768]
relations = ["h-exact"]
warmup = 1
reps = 5
processes = 2

# Batch-size scaling (tab:scaling).

[[runs]]
kind = "ours"
tag = "scaling"
params = "44"
configs = ["ifma", "avx512", "avx2"]
allocations = ["16C32T", "8C16T"]
sizes = [1024, 2048, 4096, 8192, 16384, 32768]
relation = "h-fips"
warmup = 1
reps = 5
processes = 2

[[runs]]
kind = "ours"
tag = "scaling-65"
params = "65"
configs = ["ifma", "avx512", "avx2"]
allocations = ["16C32T", "8C16T"]
sizes = [1024, 8192, 32768]
relation = "h-fips"
warmup = 1
reps = 5
processes = 2

[[runs]]
kind = "ours"
tag = "scaling-87"
params = "87"
configs = ["ifma", "avx512", "avx2"]
allocations = ["16C32T", "8C16T"]
sizes = [1024, 8192, 32768]
relation = "h-fips"
