# Kernel tiers and build flags.
#
# One release build serves every tier. The baseline is fixed by the
# repository's `.cargo/config.toml` (x86-64-v3 plus PCLMULQDQ), and each tier
# below is a run-time cap of that one binary through `AGG_ISA`. No tier has
# its own compile flags. A build that does not declare a knob ignores it; the
# run records the environment it set, and the tables show what the binary
# reported.

[build]
toolchain = "1.99.1"
aerie_toolchain = "1.95.0"
jobs = 6
package = "agg-cli"
bin = "agg"
bench_package = "agg-bench"
bench = "mode_b"

[build.binaries.agg]
description = "The single release build; the baseline lives in .cargo/config.toml."

[build.binaries.mode_b]
description = "The mode-B public-bits benchmark (agg-bench --bench mode_b)."

[rows.ifma]
binary = "agg"
label = "IFMA"
requires = ["pclmulqdq", "avx2", "avx512f", "avx512dq", "avx512bw", "avx512vl", "avx512ifma"]
# Unset AGG_ISA leaves the choice to feature detection, which selects the IFMA
# kernels on a CPU that has them.
env = {}
note = "Every detected kernel, including the IFMA field and NTT kernels."

[rows.avx512]
binary = "agg"
label = "AVX-512"
requires = ["pclmulqdq", "avx2", "avx512f"]
env = { AGG_ISA = "avx512" }
note = "AVX-512 everywhere except the IFMA field and NTT kernels."

[rows.avx2]
binary = "agg"
label = "AVX2"
requires = ["pclmulqdq", "avx2"]
env = { AGG_ISA = "avx2" }
note = "No AVX-512 instruction; the x86-64-v3 baseline."

[rows.scalar]
binary = "agg"
label = "scalar"
requires = ["pclmulqdq", "avx2"]
env = { AGG_ISA = "scalar" }
note = "Portable kernels only; a correctness check, not a reported tier."
# The paper reports the three tiers above. The scalar cap stays available for
# `run.sh gates` as a lower-bound correctness check.
gates_only = true

[topology]
# Tried in this order when a row asks for an allocation the machine lacks.
fallbacks = { "16C32T" = "8C16T", "8C16T" = "1T" }
avoid_cpu0 = true

[runtime]
# Set explicitly for every measurement.
thread_env = ["RAYON_NUM_THREADS", "OMP_NUM_THREADS"]
extra_omp = { OMP_PROC_BIND = "close", OMP_PLACES = "threads" }
