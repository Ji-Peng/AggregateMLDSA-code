tag = "quick-ablation"
params = "44"
configs = ["ifma", "avx2"]
allocations = ["8C16T"]
sizes = [1024]
relation = "h-u"
warmup = 1
reps = 1
processes = 1
traced = true
arms = [
  { tag = "defaults", env = {} },
  { tag = "flock-serial", env = { AGG_FLOCK_THREADS = "0" } },
  { tag = "late-join", env = { AGG_LATE_JOIN = "0" } },
]

[[runs]]
kind = "fresh"
tag = "quick-fresh"
params = "44"
configs = ["ifma"]
allocations = ["8C16T"]
sizes = [1024]
relation = "h-u"
reps = 1
mode = "aggregate"

