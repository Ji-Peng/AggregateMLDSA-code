# Quick mode: small batches, the configurations the CPU supports, one core
# complex with SMT (or the largest available), and one thread at 1K. Touches
# every run kind once so a ~5 minute smoke run exercises the full pipeline.

mode = "quick"
warmup = 1
reps = 3

[[runs]]
kind = "ours"
tag = "quick-ours"
params = "44"
configs = ["ifma", "avx512", "avx2"]
allocations = ["8C16T"]
sizes = [1024, 4096]
relation = "h-u"
processes = 2

[[runs]]
kind = "ours"
tag = "quick-ours-65"
params = "65"
configs = ["ifma", "avx512", "avx2"]
allocations = ["8C16T"]
sizes = [1024]
relation = "h-u"
warmup = 1
reps = 2
processes = 1

[[runs]]
kind = "ours"
tag = "quick-ours-87"
params = "87"
configs = ["ifma", "avx512", "avx2"]
allocations = ["8C16T"]
sizes = [1024]
relation = "h-u"
warmup = 1
reps = 2
processes = 1

[[runs]]
kind = "ours"
tag = "quick-ours-1t"
params = "44"
configs = ["ifma", "avx512", "avx2"]
allocations = ["1T"]
sizes = [1024]
relation = "h-u"
processes = 2

[[runs]]
kind = "mode_b"
tag = "quick-mode-b"
