# Quick mode: small batches, the configurations the CPU supports, one core
# complex with SMT (or the largest available), and one thread at 1K.

mode = "quick"
warmup = 1
reps = 3

[[runs]]
kind = "ours"
tag = "quick-ours"
configs = ["ifma", "avx512", "avx2", "scalar"]
allocations = ["8C16T"]
sizes = [1024, 4096]
relation = "h-u"

[[runs]]
kind = "ours"
tag = "quick-ours-1t"
configs = ["ifma", "avx512", "avx2", "scalar"]
allocations = ["1T"]
sizes = [1024]
relation = "h-u"

[[runs]]
kind = "aerie"
tag = "quick-aerie"
allocations = ["8C16T", "1T"]
sizes = [1024]
warmup = 1
reps = 2

[[runs]]
kind = "native"
tag = "quick-native"
allocations = ["8C16T", "1T"]
sizes = [1024]
warmup = 1
reps = 2
