# Claim -> table cell -> command -> expected value and tolerance.
# The generated claims-measured.csv in a results directory holds the values
# the evaluator measured.

[[claim]]
id = "C1"
statement = "The aggregate takes 49.2, 65.4 and 82.7 bytes per signature at 32,768 signatures for ML-DSA-44, -65 and -87."
table = "tab-bytes.tex"
cell = "total row, columns 44 / 65 / 87"
command = "./run.sh full   (then read results/LATEST/paper-tables/tab-bytes.tex)"
expected = "49.2, 65.4 and 82.7 B/sig"
tolerance = "exact (the aggregate is a deterministic byte string)"

[[claim]]
id = "C2"
statement = "Every reported tier, and the scalar gate, produces the same aggregate for each set and relation; verification accepts it."
table = "gates.json"
cell = "all_configurations_identical and verify"
command = "./run.sh gates"
expected = "one sha256 for all three tiers and the scalar gate, verify exit status 0"
tolerance = "exact"

[[claim]]
id = "C3"
statement = "Prove and verify times on a 16-core Zen 5 machine match the paper's medians across ML-DSA-44, -65 and -87."
table = "tab-baselines.tex"
cell = "ours rows: AVX2 / AVX-512 / IFMA prove times on 16C32T; tab-scaling.tex verify times"
command = "./run.sh full"
expected = "paper medians on 16C32T at 32K under H-FIPS (AVX2 / AVX-512F / IFMA: 2.70 / 2.40 / 2.34 s for 44, 3.33 / 2.96 / 2.94 s for 65, 4.25 / 3.74 / 3.72 s for 87)"
tolerance = "+-10% on the same CPU class; other microarchitectures differ"

[[claim]]
id = "C4"
statement = "Both AVX-512 tiers prove faster than AVX2, IFMA and AVX-512F lie within 3% of each other, and the GF(2)-side ablation matches tab:ablation."
table = "tab-baselines.tex"
cell = "ours tier rows in tab-baselines.tex and the three rows of tab-ablation.tex (AVX2, 16C32T, 32K)"
command = "./run.sh full   (./run.sh quick --smoke checks only the tier order, at N=1,024 with one run per cell)"
expected = "AVX2 slowest in every prove column; IFMA and AVX-512F within 3% (their order is noise); tab:ablation: full aggregate 2.70 s, Flock after the PIOP 3.12 s, public bits 2.08 s and 803.1 B/sig"
tolerance = "order exact for AVX2 against the AVX-512 tiers; +-15% for the ablation times on a Zen 5 CPU; B/sig exact"

[[claim]]
id = "C5"
statement = "Our prover and verifier compare with Aerie, Alloul26 and native ML-DSA-44, -65 and -87 verification as reported."
table = "tab-baselines.tex"
cell = "Aerie and Alloul26 rows against ours; native verification times in the table note"
command = "./run.sh full --alloul26   (./run.sh quick --alloul26 compares at N=1,024 on 8C16T and 1T only, so its ratios are not the paper's 32K ratios)"
expected = "ratios of the paper's baselines at N=32,768"
tolerance = "+-20% on the evaluator's machine"
