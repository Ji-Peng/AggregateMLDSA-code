[package]
name = "agg-piop"
description = "Sum-check PIOP stages 1-3, range leaves, weight tables, verifier and Akita openings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["parallel"]
parallel = ["aerie-falcon/parallel", "aerie-prover/parallel"]
# Opt-in AVX-512 paths. Aerie's kernels (aerie-simd) are runtime-dispatched
# with a scalar fallback whatever this flag says; the flag gates our own
# AVX-512 kernels (none yet) and is what scripts/bench.sh AVX512=1 turns on.
avx512 = []
# Test stand-ins that make the verifier unsound outside tests (docs/deviations.md P4):
# `prover::FixedMatrices` (matrices that ignore the bridge seed), `prover::NoKeccak` and
# `verifier::NoKeccakVerifier` (Flock profile 0, no Keccak argument). Without this
# feature these types do not exist and the verifier refuses Flock profile 0. Never
# enable it in a prover, verifier or benchmark build.
test-hooks = []

[dependencies]
agg-witness = { workspace = true }
agg-pcs-config = { workspace = true }
agg-bridge = { workspace = true }
aerie-falcon = { workspace = true }
aerie-prover = { workspace = true }
aerie-simd = { workspace = true }
akita-algebra = { workspace = true }
akita-config = { workspace = true }
akita-error = { workspace = true }
akita-params = { workspace = true }
akita-pcs = { workspace = true }
akita-serialization = { workspace = true }
akita-sumcheck = { workspace = true }
akita-transcript = { workspace = true }
akita-types = { workspace = true }
akita-verifier = { workspace = true }
jolt-field = { workspace = true }
jolt-poly = { workspace = true }
spongefish = { workspace = true }
rayon = { workspace = true }
sha3 = { workspace = true }

[dev-dependencies]
# The integration tests (tests/*.rs) use the stand-ins of the `test-hooks` feature.
agg-piop = { path = ".", features = ["test-hooks"] }
# The joint bridge test (tests/joint_bridge.rs) runs the Flock side of mode A.
agg-keccak = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
