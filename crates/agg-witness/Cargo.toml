[package]
name = "agg-witness"
description = "ML-DSA-44 native verification, key expansion, witness derivation and table builders."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Relation H-exact (spec Appendix A): z and u by slack digits.
h-exact = []
# Relation S1+S2, `relation = fips` (spec Appendix A): FIPS-faithful layout with re-encoding.
fips = []

[dependencies]
ml-dsa = { workspace = true }
sha3 = { workspace = true }
rayon = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
