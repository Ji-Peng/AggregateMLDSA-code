[package]
name = "agg-pcs-config"
description = "Akita commitment presets, fold-schedule catalogs and the two-round commit driver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The generated fold-schedule catalog under `src/schedules/`. Akita resolves
# schedules only from generated catalogs, so the feature is on by default;
# turn it off only while regenerating the catalog (docs/pcs-config.md).
default = ["schedules", "parallel"]
schedules = []
parallel = [
  "akita-pcs/parallel",
  "akita-verifier/parallel",
  "jolt-field/parallel",
]

[dependencies]
aerie-pcs-config = { workspace = true }
akita-challenges = { workspace = true }
akita-config = { workspace = true }
akita-error = { workspace = true }
akita-params = { workspace = true }
akita-pcs = { workspace = true }
akita-serialization = { workspace = true }
akita-types = { workspace = true }
akita-verifier = { workspace = true }
jolt-field = { workspace = true }

[dev-dependencies]
akita-planner = { workspace = true, features = ["catalog-gen"] }
akita-schedules = { workspace = true }
serde_json = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[[bench]]
name = "commit_open"
harness = false
