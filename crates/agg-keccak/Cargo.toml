[package]
name = "agg-keccak"
description = "Flock Keccak gate port, sponge union circuit and tied parts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Marker only: the AVX-512 kernels of `src/simd` and the vendored Flock trees are
# selected at run time whatever this flag says (README "SIMD policy").
avx512 = []

[dependencies]
aerie-keccak = { workspace = true }
agg-bridge = { workspace = true }
agg-mldsa-simd = { workspace = true }
agg-witness = { workspace = true }
flock-core = { workspace = true }
flock-field = { workspace = true }
flock-prover = { workspace = true }
sha3 = { workspace = true }
rayon = { workspace = true }
bincode = "1.3"

[dev-dependencies]
keccak = "0.1.6"

# The bench target installs Flock's counting allocator (a `GlobalAlloc`, which
# needs `unsafe`) and opts in with a file-level allow; library code stays
# unsafe-free under `deny` except for one audited byte view in `flock_union`
# (the zerocheck's input, as Flock's own prover builds it), allowed at the item.
[[bench]]
name = "keccak_sponge"
harness = false

[lints.rust]
unsafe_code = "deny"
