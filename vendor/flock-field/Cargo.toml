# Vendored copy of flock-field from succinctlabs/flock at rev
# 83f963e8ede6d9a85ec4762b0c018943b6f6542b with the one change listed in PATCH.md: `#[inline]`
# on the x86 scalar GF(2^128) multiply, unreduced multiply and square. The
# workspace-inherited fields of the upstream manifest are inlined here.
[package]
name = "flock-field"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Succinct Labs", "Benedikt Bunz", "William Wang"]
description = "Binary extension fields used by Flock protocols (vendored, patched)."
publish = false

[features]
mul-count = []

[dependencies]
serde = { version = "1", features = ["derive"] }

[lints.clippy]
needless_range_loop = "allow"
explicit_counter_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
identity_op = "allow"
erasing_op = "allow"
manual_memcpy = "allow"
assertions_on_constants = "allow"
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"
unusual_byte_groupings = "allow"
wildcard_imports = "deny"

# Upstream builds flock-field as a git dependency, whose warnings Cargo hides; as a path
# dependency its dead-code and unused-import warnings (kernels unused on this target) would show up.
[lints.rust]
dead_code = "allow"
unused_imports = "allow"
