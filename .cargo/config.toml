# One baseline for every shipped build: x86-64-v3, which is AVX2, plus
# carry-less multiplication. The baseline is a hard requirement: the binary
# does not start on a CPU without AVX2. AVX-512F, IFMA and the remaining
# instruction sets are selected at run time from the CPU, capped by
# `AGG_ISA`. Do not add `target-cpu=native`, `znver5` or a global
# `x86-64-v4` target: the compiler would then auto-vectorise portable code with
# AVX-512, and the `AGG_ISA=avx2` tier would no longer be free of AVX-512
# instructions.
[build]
rustflags = [
    "-C", "target-cpu=x86-64-v3",
    "-C", "target-feature=+pclmulqdq",
]
